# Sito Odyra: nginx davanti a pagine statiche (dist/) e al piccolo server delle API (server/, su 127.0.0.1:8090).
# È un modello: l'entrypoint sostituisce solo ${PORT} (Railway) e lo scrive in /etc/nginx/conf.d/default.conf.
# Le intestazioni di sicurezza stanno in /etc/nginx/odyra-headers.conf (server/odyra-headers.conf nel repository):
# in nginx un add_header dentro un location annulla quelli del server, quindi ogni location che ne aggiunge uno
# include di nuovo il file.

# Agenti che chiedono Markdown (Accept: text/markdown) ricevono la versione .md della pagina, se esiste.
map $http_accept $md_suffix {
  default "";
  "~*text/markdown" ".md";
}
# Indirizzo del visitatore. Su Railway il proxy di bordo scrive X-Real-IP con l'indirizzo della connessione del
# visitatore (docs.railway.com, "Specs & Limits"): il visitatore non può sceglierlo. X-Forwarded-For invece conserva
# i valori mandati dal client (il primo è falsificabile) e non si usa mai. Si accetta solo un valore che abbia la
# forma di un indirizzo IP (niente chiavi arbitrarie o lunghe nelle zone); altrimenti, e in locale, vale l'indirizzo
# della connessione. Il server delle API legge solo X-Real-IP, che nginx riscrive sempre.
map $http_x_real_ip $client_ip {
  "~^[0-9A-Fa-f:.]{3,45}$" $http_x_real_ip;
  default $remote_addr;
}
# File con ?v=<hash> (CSS, JS, librerie): immutabili; senza versione: un'ora.
map $arg_v $versioned_cache {
  default "public, max-age=31536000, immutable";
  "" "public, max-age=3600";
}
limit_req_zone $client_ip zone=odyra_api:10m rate=12r/m;
limit_req_status 429;
limit_conn_zone $client_ip zone=odyra_conn:10m;
limit_conn_status 429;

server {
  listen ${PORT};
  server_name _;
  # www.odyrasystemautomation.it → dominio principale, in un solo salto (gli indirizzi canonici sono senza www).
  if ($host = "www.odyrasystemautomation.it") { return 301 https://odyrasystemautomation.it$request_uri; }
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  server_tokens off;
  client_max_body_size 16k;
  # Connessioni lente o tenute aperte: tempi brevi e un tetto di connessioni contemporanee per visitatore.
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 20s;
  keepalive_timeout 30s;
  limit_conn odyra_conn 40;

  include /etc/nginx/mime.types;
  types { text/markdown md; application/manifest+json webmanifest; }
  charset utf-8;
  charset_types text/plain text/markdown text/css application/javascript application/json application/xml application/manifest+json;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/markdown text/css application/javascript application/json application/xml application/manifest+json image/svg+xml;

  include /etc/nginx/odyra-headers.conf;
  error_page 404 /404.html;

  # Solo i metodi che il sito usa (POST solo per /api/: sui file statici nginx risponde 405 da sé).
  if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
  # Barra rovesciata nel percorso (anche come %5C): i browser la leggono come "/", quindi "/\\evil.com" in un
  # Location diventerebbe "//evil.com" (redirect verso un altro sito). Nessuna pagina la usa.
  if ($uri ~ "\x5c") { return 404; }

  # ───────── redirect permanenti: sempre in un solo salto, prima della regola sulla barra finale ─────────
  # Versione statica precedente (.html e cartelle con barra finale).
  # Anteprima del sito statico: prima delle altre regole, così ogni indirizzo arriva in un solo salto.
  rewrite ^/anteprima/?$ / permanent;
  rewrite ^/anteprima/+(index\.html|home(/.*)?)$ / permanent;
  rewrite ^/anteprima/+agenti(/.*)?$ /capabilities permanent;
  rewrite ^/anteprima/+casi(/.*)?$ /lavori permanent;
  rewrite ^/anteprima/+academy(/.*)?$ /eventi permanent;
  rewrite ^/anteprima/+chi-siamo(/.*)?$ /studio permanent;
  rewrite ^/anteprima/+piattaforma(/.*)?$ /tecnologie permanent;
  rewrite ^/anteprima/+es(/(index\.html)?)?$ /es/ permanent;
  rewrite ^/anteprima/+([^/\x5c].*?)(/index\.html|/)?$ /$1 permanent;
  rewrite ^/index\.html$ / permanent;
  rewrite ^/es/index\.html$ /es/ permanent;
  rewrite ^/([^/\x5c].*)/index\.html$ /$1 permanent;
  rewrite ^/piattaforma(\.html|/)?$ /tecnologie permanent;
  rewrite ^/piattaforma\.md$ /tecnologie.md permanent;
  rewrite ^/agenti(\.html|/)?$ /capabilities permanent;
  rewrite ^/agenti\.md$ /capabilities.md permanent;
  rewrite ^/casi(\.html|/)?$ /lavori permanent;
  rewrite ^/casi\.md$ /lavori.md permanent;
  rewrite ^/chi-siamo(\.html|/)?$ /studio permanent;
  rewrite ^/chi-siamo\.md$ /studio.md permanent;
  rewrite ^/academy(\.html|/)?$ /eventi permanent;
  rewrite ^/academy\.md$ /eventi.md permanent;
  rewrite ^/il-gruppo\.html$ /studio permanent;
  rewrite ^/settori\.html$ /soluzioni permanent;
  rewrite ^/per-i-gestionali\.html$ /partner permanent;
  rewrite ^/su-misura(\.html|/)?$ /soluzioni permanent;
  rewrite ^/su-misura\.md$ /soluzioni.md permanent;
  rewrite ^/goagent(\.html|/)?$ /case/boss-italia permanent;
  rewrite ^/goagent\.md$ /case/boss-italia.md permanent;
  rewrite ^/contatti\.html$ /contatti permanent;
  rewrite ^/privacy\.html$ /privacy permanent;
  rewrite ^/gruppo\.html$ /studio permanent;
  rewrite ^/enterprise\.html$ /soluzioni permanent;
  rewrite ^/software-house\.html$ /partner permanent;
  rewrite ^/tecnologia\.html$ /tecnologie permanent;
  rewrite ^/casi-studio\.html$ /lavori permanent;
  rewrite ^/hako\.html$ /case/hako permanent;
  rewrite ^/agente-commerciale-ai\.html$ /capabilities/lead-to-sale permanent;
  rewrite ^/agenti-ai-vocali-whatsapp\.html$ /capabilities/ai-agents permanent;
  rewrite ^/(soluzioni|capabilities|partner|lavori|tecnologie|eventi|studio|team|processo|cookie|termini|domande|demo|centralino-ai|segretaria-ai)\.html$ /$1 permanent;
  rewrite ^/proposte(/.*)?$ / permanent;
  rewrite ^/es/piattaforma\.html$ /es/plataforma permanent;
  rewrite ^/es/(settori|su-misura|enterprise)\.html$ /es/soluciones permanent;
  rewrite ^/es/(per-i-gestionali|software-house)\.html$ /es/socios permanent;
  rewrite ^/es/(agente-commerciale-ai|agenti-ai-vocali-whatsapp)\.html$ /es/agentes permanent;
  rewrite ^/es/(casi-studio|hako)\.html$ /es/casos permanent;
  rewrite ^/es/tecnologia\.html$ /es/plataforma permanent;
  rewrite ^/es/gruppo\.html$ /es/quienes-somos permanent;
  rewrite ^/es/goagent(\.html|/)?$ /es/casos permanent;
  rewrite ^/es/goagent\.md$ /es/casos.md permanent;
  rewrite ^/es/il-gruppo\.html$ /es/quienes-somos permanent;
  rewrite ^/es/contatti\.html$ /es/contacto permanent;
  rewrite ^/es/privacy\.html$ /es/privacidad permanent;
  rewrite ^/es/sectores/?$ /es/soluciones permanent;
  rewrite ^/es/a-medida/?$ "/es/soluciones#grandi-aziende" permanent;
  rewrite ^/es/(sectores|a-medida)\.md$ /es/soluciones.md permanent;
  # Sito precedente (indirizzi indicizzati che non hanno più una pagina propria).
  rewrite ^/case/(sportit|eva|onda-fit|digital-revenue)/?$ /lavori permanent;
  rewrite ^/cosa-facciamo/?$ /capabilities permanent;
  rewrite ^/message-agent/?$ /capabilities/chatbot-assistenti permanent;
  rewrite ^/servizi(/.*)?$ /capabilities permanent;
  rewrite ^/settori/?$ /lavori/settori permanent;
  rewrite ^/settori/(?!(centri-estetici|studi-dentistici)(\.md|/)?$).+$ /lavori/settori permanent;
  rewrite ^/settori\.md$ /lavori/settori.md permanent;
  rewrite ^/area-clienti.*$ / permanent;
  rewrite ^/admin.*$ / permanent;
  rewrite ^/og-image-v2\.png$ /assets/img/og.jpg permanent;
  rewrite ^/icon-512-v2\.png$ /assets/icons/fav-512.png permanent;
  rewrite ^/icon-192\.png$ /assets/icons/fav-192.png permanent;
  rewrite ^/favicon-(16x16|32x32)\.png$ /assets/icons/fav-32.png permanent;
  rewrite ^/favicon-48x48\.png$ /assets/icons/fav-48.png permanent;
  rewrite ^/favicon\.png$ /assets/icons/fav-48.png permanent;
  rewrite ^/apple-touch-icon(-precomposed)?\.png$ /assets/icons/fav-180.png permanent;
  rewrite ^/manifest\.json$ /manifest.webmanifest permanent;
  # Indirizzi senza barra finale: /pagina/ -> /pagina (tranne / e /es/), /es -> /es/.
  # Le catture non iniziano mai con "/" o "\\": il Location resta un percorso dello stesso sito.
  rewrite ^/es$ /es/ permanent;
  rewrite ^/(?!es/$)([^/\x5c].*)/$ /$1 permanent;

  # ───────── API ─────────
  location /api/ {
    limit_req zone=odyra_api burst=10 nodelay;
    limit_conn odyra_conn 4;
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Il server delle API si fida solo di X-Real-IP: nginx lo riscrive sempre e toglie X-Forwarded-For del client.
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 45s;
    proxy_buffering off;
    proxy_hide_header X-Content-Type-Options;  # già nelle intestazioni comuni: una sola copia
    error_page 502 503 504 = @api_down;
    error_page 429 = @api_busy;
    error_page 413 = @api_big;
  }
  location @api_big {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/odyra-headers.conf;
    return 413 '{"error":"troppo_grande"}';
  }
  location @api_busy {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;
    include /etc/nginx/odyra-headers.conf;
    return 429 '{"error":"troppe_richieste"}';
  }
  location @api_down {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/odyra-headers.conf;
    return 503 '{"error":"non_disponibile"}';
  }

  # ───────── file nascosti (.gitkeep, .git, .env...): mai serviti ─────────
  location ~ /\. {
    return 404;
  }

  # ───────── pagine ─────────
  location = / {
    add_header Vary "Accept" always;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/odyra-headers.conf;
    try_files /index$md_suffix /index.html =404;
  }
  location = /es/ {
    error_page 404 /es/404.html;
    add_header Vary "Accept" always;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/odyra-headers.conf;
    try_files /es/index$md_suffix /es/index.html =404;
  }
  location /es/ {
    error_page 404 /es/404.html;
    add_header Vary "Accept" always;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/odyra-headers.conf;
    try_files $uri$md_suffix $uri $uri/index.html =404;
  }
  location / {
    add_header Vary "Accept" always;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/odyra-headers.conf;
    try_files $uri$md_suffix $uri $uri/index.html =404;
  }
  location ~ ^/(es/)?404\.html$ {
    internal;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/odyra-headers.conf;
  }

  # ───────── file per motori e assistenti ─────────
  location ~ \.(md|txt)$ {
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Robots-Tag "noindex" always;
    include /etc/nginx/odyra-headers.conf;
    try_files $uri =404;
  }
  location ~ ^/(sitemap\.xml|manifest\.webmanifest)$ {
    add_header Cache-Control "public, max-age=3600" always;
    include /etc/nginx/odyra-headers.conf;
    try_files $uri =404;
  }
  location = /favicon.ico {
    add_header Cache-Control "public, max-age=2592000" always;
    include /etc/nginx/odyra-headers.conf;
    try_files /assets/icons/favicon.ico =404;
  }

  # ───────── risorse statiche ─────────
  location ~ ^/[^/]+\.(css|js)$ {
    add_header Cache-Control $versioned_cache always;
    include /etc/nginx/odyra-headers.conf;
    try_files $uri =404;
  }
  location /assets/vendor/ {
    add_header Cache-Control $versioned_cache always;
    include /etc/nginx/odyra-headers.conf;
    try_files $uri =404;
  }
  location /assets/fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/odyra-headers.conf;
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=2592000" always;
    include /etc/nginx/odyra-headers.conf;
    try_files $uri =404;
  }
}
