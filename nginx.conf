# Sito Odyra: nginx davanti a pagine statiche (dist/) e al piccolo server delle API (server/, su 127.0.0.1:8090).
# È un modello: l'entrypoint sostituisce solo ${PORT} (Railway) e lo scrive in /etc/nginx/conf.d/default.conf.
# Le intestazioni di sicurezza stanno in /etc/nginx/odyra-headers.conf (server/odyra-headers.conf nel repository):
# in nginx un add_header dentro un location annulla quelli del server, quindi ogni location che ne aggiunge uno
# include di nuovo il file.

# Agenti che chiedono Markdown (Accept: text/markdown) ricevono la versione .md della pagina, se esiste.
map $http_accept $md_suffix {
  default "";
  "~*text/markdown" ".md";
}
# Indirizzo del visitatore: Railway lo passa in X-Real-IP; in locale vale l'indirizzo della connessione.
map $http_x_real_ip $client_ip {
  default $http_x_real_ip;
  "" $remote_addr;
}
# File con ?v=<hash> (CSS, JS, librerie): immutabili; senza versione: un'ora.
map $arg_v $versioned_cache {
  default "public, max-age=31536000, immutable";
  "" "public, max-age=3600";
}
limit_req_zone $client_ip zone=odyra_api:10m rate=12r/m;
limit_req_status 429;

server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  server_tokens off;
  client_max_body_size 16k;

  include /etc/nginx/mime.types;
  types { text/markdown md; application/manifest+json webmanifest; }
  charset utf-8;
  charset_types text/plain text/markdown text/css application/javascript application/json application/xml application/manifest+json;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/markdown text/css application/javascript application/json application/xml application/manifest+json image/svg+xml;

  include /etc/nginx/odyra-headers.conf;
  error_page 404 /404.html;

  # ───────── redirect permanenti: sempre in un solo salto, prima della regola sulla barra finale ─────────
  # Versione statica precedente (.html e cartelle con barra finale).
  rewrite ^/index\.html$ / permanent;
  rewrite ^/es/index\.html$ /es/ permanent;
  rewrite ^/(.+)/index\.html$ /$1 permanent;
  rewrite ^/piattaforma(\.html|/)?$ /tecnologie permanent;
  rewrite ^/piattaforma\.md$ /tecnologie.md permanent;
  rewrite ^/agenti/?$ /capabilities permanent;
  rewrite ^/agenti\.md$ /capabilities.md permanent;
  rewrite ^/casi/?$ /lavori permanent;
  rewrite ^/casi\.md$ /lavori.md permanent;
  rewrite ^/chi-siamo/?$ /studio permanent;
  rewrite ^/chi-siamo\.md$ /studio.md permanent;
  rewrite ^/academy/?$ /eventi permanent;
  rewrite ^/academy\.md$ /eventi.md permanent;
  rewrite ^/il-gruppo\.html$ /studio permanent;
  rewrite ^/settori\.html$ /soluzioni permanent;
  rewrite ^/per-i-gestionali\.html$ /partner permanent;
  rewrite ^/su-misura(\.html|/)?$ /soluzioni permanent;
  rewrite ^/su-misura\.md$ /soluzioni.md permanent;
  rewrite ^/goagent(\.html|/)?$ /case/boss-italia permanent;
  rewrite ^/goagent\.md$ /case/boss-italia.md permanent;
  rewrite ^/contatti\.html$ /contatti permanent;
  rewrite ^/privacy\.html$ /privacy permanent;
  rewrite ^/proposte(/.*)?$ / permanent;
  rewrite ^/anteprima/?(.*)$ /$1 permanent;
  rewrite ^/es/piattaforma\.html$ /es/plataforma permanent;
  rewrite ^/es/(settori|per-i-gestionali|su-misura)\.html$ /es/soluciones permanent;
  rewrite ^/es/goagent(\.html|/)?$ /es/casos permanent;
  rewrite ^/es/goagent\.md$ /es/casos.md permanent;
  rewrite ^/es/il-gruppo\.html$ /es/quienes-somos permanent;
  rewrite ^/es/contatti\.html$ /es/contacto permanent;
  rewrite ^/es/privacy\.html$ /es/privacidad permanent;
  rewrite ^/es/sectores/?$ /es/soluciones permanent;
  rewrite ^/es/socios/?$ "/es/soluciones#software-house" permanent;
  rewrite ^/es/a-medida/?$ "/es/soluciones#grandi-aziende" permanent;
  rewrite ^/es/(sectores|socios|a-medida)\.md$ /es/soluciones.md permanent;
  # Sito precedente (indirizzi indicizzati che non hanno più una pagina propria).
  rewrite ^/case/(sportit|eva|onda-fit|digital-revenue)/?$ /lavori permanent;
  rewrite ^/cosa-facciamo/?$ /capabilities permanent;
  rewrite ^/message-agent/?$ / permanent;
  rewrite ^/servizi(/.*)?$ /capabilities permanent;
  rewrite ^/settori/?$ /lavori/settori permanent;
  rewrite ^/settori\.md$ /lavori/settori.md permanent;
  rewrite ^/prenota/?$ /contatti permanent;
  rewrite ^/area-clienti.*$ / permanent;
  rewrite ^/admin.*$ / permanent;
  rewrite ^/og-image-v2\.png$ /assets/img/og.jpg permanent;
  rewrite ^/icon-512-v2\.png$ /assets/icons/fav-512.png permanent;
  rewrite ^/icon-192\.png$ /assets/icons/fav-192.png permanent;
  rewrite ^/favicon-(16x16|32x32)\.png$ /assets/icons/fav-32.png permanent;
  rewrite ^/favicon-48x48\.png$ /assets/icons/fav-48.png permanent;
  rewrite ^/favicon\.png$ /assets/icons/fav-48.png permanent;
  rewrite ^/apple-touch-icon(-precomposed)?\.png$ /assets/icons/fav-180.png permanent;
  rewrite ^/manifest\.json$ /manifest.webmanifest permanent;
  # Indirizzi senza barra finale: /pagina/ -> /pagina (tranne / e /es/), /es -> /es/.
  rewrite ^/es$ /es/ permanent;
  rewrite ^/(?!es/$)(.+)/$ /$1 permanent;

  # ───────── API ─────────
  location /api/ {
    limit_req zone=odyra_api burst=10 nodelay;
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 3s;
    proxy_read_timeout 45s;
    proxy_buffering off;
    error_page 502 503 504 = @api_down;
  }
  location @api_down {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/odyra-headers.conf;
    return 503 '{"error":"non_disponibile"}';
  }

  # ───────── pagine ─────────
  location = / {
    add_header Vary "Accept" always;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/odyra-headers.conf;
    try_files /index$md_suffix /index.html =404;
  }
  location = /es/ {
    error_page 404 /es/404.html;
    add_header Vary "Accept" always;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/odyra-headers.conf;
    try_files /es/index$md_suffix /es/index.html =404;
  }
  location /es/ {
    error_page 404 /es/404.html;
    add_header Vary "Accept" always;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/odyra-headers.conf;
    try_files $uri$md_suffix $uri $uri/index.html =404;
  }
  location / {
    add_header Vary "Accept" always;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/odyra-headers.conf;
    try_files $uri$md_suffix $uri $uri/index.html =404;
  }
  location ~ ^/(es/)?404\.html$ {
    internal;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/odyra-headers.conf;
  }

  # ───────── file per motori e assistenti ─────────
  location ~ \.(md|txt)$ {
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Robots-Tag "noindex" always;
    include /etc/nginx/odyra-headers.conf;
    try_files $uri =404;
  }
  location ~ ^/(sitemap\.xml|manifest\.webmanifest)$ {
    add_header Cache-Control "public, max-age=3600" always;
    include /etc/nginx/odyra-headers.conf;
    try_files $uri =404;
  }
  location = /favicon.ico {
    add_header Cache-Control "public, max-age=2592000" always;
    include /etc/nginx/odyra-headers.conf;
    try_files /assets/icons/favicon.ico =404;
  }

  # ───────── risorse statiche ─────────
  location ~ ^/[^/]+\.(css|js)$ {
    add_header Cache-Control $versioned_cache always;
    include /etc/nginx/odyra-headers.conf;
    try_files $uri =404;
  }
  location /assets/vendor/ {
    add_header Cache-Control $versioned_cache always;
    include /etc/nginx/odyra-headers.conf;
    try_files $uri =404;
  }
  location /assets/fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/odyra-headers.conf;
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=2592000" always;
    include /etc/nginx/odyra-headers.conf;
    try_files $uri =404;
  }
}
