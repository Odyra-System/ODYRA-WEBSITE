server {
  listen ${PORT};
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/manifest+json application/json;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options "nosniff" always; }
  location /es/ { error_page 404 /es/404.html; try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=604800"; add_header X-Content-Type-Options "nosniff" always; }
}
