# Sito statico Odyra System. $PORT arriva dall'ambiente (Railway).
map $http_accept $want_md {
  default 0;
  "~*text/markdown" 1;
}

server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  server_tokens off;

  charset utf-8;
  charset_types text/plain text/markdown text/css application/javascript application/json application/xml application/manifest+json;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/markdown text/css application/javascript application/json application/xml application/manifest+json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Link "</llms.txt>; rel=\"alternate\"; type=\"text/plain\"" always;

  # Vecchi indirizzi: redirect permanenti verso le pagine attuali, in un solo passaggio.
  rewrite ^/index\.html$ / permanent;
  rewrite ^/piattaforma\.html$ /piattaforma/ permanent;
  rewrite ^/settori\.html$ /soluzioni/ permanent;
  rewrite ^/per-i-gestionali\.html$ /soluzioni/ permanent;
  rewrite ^/goagent\.html$ /casi/ permanent;
  rewrite ^/su-misura\.html$ /soluzioni/ permanent;
  rewrite ^/il-gruppo\.html$ /chi-siamo/ permanent;
  rewrite ^/contatti\.html$ /contatti/ permanent;
  rewrite ^/privacy\.html$ /privacy/ permanent;
  # Pagine italiane della versione precedente, confluite nel sito nuovo.
  location ~ ^/settori/?$ { return 301 /soluzioni/; }
  location ~ ^/partner/?$ { return 301 /soluzioni/#software-house; }
  location ~ ^/su-misura/?$ { return 301 /soluzioni/#grandi-aziende; }
  location ~ ^/goagent/?$ { return 301 /casi/; }
  location ~ ^/(settori|partner|su-misura)\.md$ { return 301 /soluzioni.md; }
  location = /goagent.md { return 301 /casi.md; }
  # L'anteprima del nuovo sito è diventata il sito: stessi indirizzi senza /anteprima.
  location ^~ /anteprima { rewrite ^/anteprima/?(.*)$ /$1 permanent; }
  rewrite ^/es/index\.html$ /es/ permanent;
  rewrite ^/es/piattaforma\.html$ /es/plataforma/ permanent;
  rewrite ^/es/settori\.html$ /es/sectores/ permanent;
  rewrite ^/es/per-i-gestionali\.html$ /es/socios/ permanent;
  rewrite ^/es/goagent\.html$ /es/goagent/ permanent;
  rewrite ^/es/su-misura\.html$ /es/a-medida/ permanent;
  rewrite ^/es/il-gruppo\.html$ /es/quienes-somos/ permanent;
  rewrite ^/es/contatti\.html$ /es/contacto/ permanent;
  rewrite ^/es/privacy\.html$ /es/privacidad/ permanent;
  rewrite ^/proposte(/.*)?$ / permanent;

  # Agenti che chiedono Markdown (Accept: text/markdown) ricevono la versione .md della pagina.
  location = / {
    if ($want_md) { rewrite ^ /index.md last; }
    add_header Vary "Accept" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Link "</index.md>; rel=\"alternate\"; type=\"text/markdown\"" always;
    try_files /index.html =404;
  }
  location = /es/ {
    if ($want_md) { rewrite ^ /es/index.md last; }
    add_header Vary "Accept" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /es/index.html =404;
  }

  location ~ ^/es/[a-z0-9-]+/$ {
    if ($want_md) { rewrite ^(.*)/$ $1.md last; }
    error_page 404 /es/404.html;
    add_header Vary "Accept" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ =404;
  }
  location ~ ^/[a-z0-9-]+/$ {
    if ($want_md) { rewrite ^(.*)/$ $1.md last; }
    error_page 404 /404.html;
    add_header Vary "Accept" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ =404;
  }

  location ~ \.(md|txt|xml)$ {
    types { text/markdown md; text/plain txt; application/xml xml; }
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex" always;
    try_files $uri =404;
  }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "public, max-age=86400" always; try_files $uri =404; }
  location = /robots.txt { add_header Cache-Control "public, max-age=3600" always; try_files $uri =404; }
  location = /sitemap.xml { add_header Cache-Control "public, max-age=3600" always; try_files $uri =404; }

  location /assets/ {
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location ~ \.(css|js)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /es/ {
    error_page 404 /es/404.html;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
  location / {
    error_page 404 /404.html;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
