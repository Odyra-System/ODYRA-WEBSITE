# Intestazioni di sicurezza per ogni risposta. Incluso da nginx.conf nel server e in ogni location con add_header.
# CSP: niente script in linea (consenso e demo vocale stanno in /odyra-app.js). 'unsafe-inline' solo per gli stili,
# perché alcune pagine usano attributi style="--p:…". Il server della demo vocale è ammesso come *.livekit.cloud:
# se LIVEKIT_URL punta altrove, aggiungi quel dominio a connect-src (wss:// e https://).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://*.googletagmanager.com https://*.google-analytics.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google.com https://*.google.it https://*.google.es https://*.googletagmanager.com https://*.google-analytics.com https://*.doubleclick.net https://www.googleadservices.com https://*.clarity.ms https://c.bing.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.google.com https://google.com https://*.doubleclick.net https://www.googleadservices.com https://pagead2.googlesyndication.com https://*.clarity.ms https://c.bing.com wss://*.livekit.cloud https://*.livekit.cloud; media-src 'self' blob:; worker-src 'self' blob:; frame-src https://calendar.google.com https://td.doubleclick.net https://*.doubleclick.net https://www.googletagmanager.com; manifest-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
